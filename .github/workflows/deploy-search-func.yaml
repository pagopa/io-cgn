name: Deploy Function App (search-func)

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "apps/search-func/CHANGELOG.md"
      - ".github/workflows/deploy-search-func.yaml"

jobs:
  deploy:
    name: Deploy Search Func
    uses: pagopa/dx/.github/workflows/release-azure-appsvc-v1.yaml@818248628e8291b7059d275bdd076b532bd77103
    secrets: inherit
    with:
      workspace_name: search-func
      environment: io-app-prod
      resource_group_name: io-p-itn-cgn-rg-01
      web_app_name: io-p-itn-cgn-search-func-02
      use_labels: true
      use_private_agent: true
      override_labels: io-prod
      disable_auto_staging_deploy: true
    permissions:
      attestations: write
      contents: read
      id-token: write
