name: Release Infrastructure IO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra-io/resources/**"

jobs:
  infra_release:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@36ff122137235d814f3dbd20068acfb521d3fd74 # main
    name: Release Infrastructure IO PROD
    secrets: inherit
    with:
      environment: prod
      base_path: infra-io/resources
      override_github_environment: io-prod
      use_private_agent: true
      use_labels: true
      override_labels: io-prod
