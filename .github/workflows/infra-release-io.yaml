name: Release Infrastructure IO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra-io/resources/**"

jobs:
  infra_release:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@6abcf9bc0956833202dae18c8218b4a4bc85a7f5 # main
    name: Release Infrastructure IO PROD
    secrets: inherit
    with:
      environment: prod
      base_path: infra-io/resources
      override_github_environment: io-prod
      use_private_agent: true
      use_labels: true
      override_labels: io-prod
