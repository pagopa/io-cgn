name: Release Infrastructure IO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra-io/resources/**"

jobs:
  infra_release:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@8ec64257f46bb8c03509d317b42fbf6a2da2c63a # main
    name: Release Infrastructure IO PROD
    secrets: inherit
    with:
      environment: prod
      base_path: infra-io/resources
      override_github_environment: io-prod
      use_private_agent: true
      use_labels: true
      override_labels: io-prod
