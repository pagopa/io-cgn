name: Release Infrastructure IO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra-io/resources/**"

jobs:
  infra_release:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@d025f45d6725b88af4a7b6e391f4ae13d58af13c # main
    name: Release Infrastructure IO PROD
    secrets: inherit
    with:
      environment: prod
      base_path: infra-io/resources
      override_github_environment: io-prod
      use_private_agent: true
      use_labels: true
      override_labels: io-prod
