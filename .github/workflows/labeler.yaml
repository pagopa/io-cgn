name: PR - Labeler

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: PR Labeler
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/labeler@98ce1450c7908643084f7487327dfa4f4bf8a367 # main
        with:
          sync-labels: true
