name: PR - Labeler

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: PR Labeler
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/labeler@e418da8824fe5e9edfa64aae6cd5648b895283c4 # main
        with:
          sync-labels: true
