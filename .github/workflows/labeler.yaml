name: PR - Labeler

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: PR Labeler
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/labeler@a4c9e93145dff057e9782320b30e8b5e57174f4d # main
        with:
          sync-labels: true
