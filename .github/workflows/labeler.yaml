name: PR - Labeler

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: PR Labeler
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/labeler@bc32c493030cc908233048429a1f81da3057fbbc # main
        with:
          sync-labels: true
